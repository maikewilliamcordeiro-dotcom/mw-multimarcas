<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<style>
/* Layout: catalog pages stacked in one column on MW navy, video grid after the winter line, WhatsApp bar fixed at bottom */
:root{--navy:#080830;--navy2:#12124a;--ink:#f2f2f6;--muted:#b9b9d6;--yel:#ffbb00;--wa:#1faa59;
--f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
body{background:var(--navy);color:var(--ink);font-family:var(--f);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--navy) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--navy2)}
.top .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;letter-spacing:.02em;font-size:16px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.chip{color:var(--navy);background:var(--yel);text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.chip:focus-visible,.wa:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pg{display:block;width:100%;height:auto;border-radius:6px;background:var(--navy2)}
.videos{background:var(--navy2);border-radius:6px;padding:28px 18px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:70px}
.vhead{text-align:left;max-width:60ch}
.eyebrow{color:var(--yel);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.vhead h2{margin:.2em 0 .25em;font-size:clamp(24px,5vw,36px);line-height:1.1;text-wrap:balance}
.vhead p{margin:0;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.vgrid{grid-template-columns:repeat(2,1fr)}}
.vd{margin:0;aspect-ratio:9/16;max-width:100%;border-radius:8px;overflow:hidden;background:#000;border:2px solid var(--yel)}
.vd video{width:100%;height:100%;object-fit:cover;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);border-top:1px solid var(--navy2);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .num{font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.bar .num small{display:block;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.wa{background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px;font-size:15px}
@media (prefers-reduced-motion:reduce){.top{backdrop-filter:none}}
</style>
</head>
